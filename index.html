/* =========================

const star=(g,cx,cy,R,n,col,r)=>{

g.fillStyle=col;

g.beginPath();

for(let i=0;i<n*2;i++){

const a=-Math.PI/2+i*Math.PI/n;

const d=i%2?(r||R*.4):R;

g.lineTo(
cx+Math.cos(a)*d,
cy+Math.sin(a)*d
);

}

g.closePath();

g.fill();

};


/* =========================
   UNION JACK
========================= */

const jack=(g,x,y,w,h)=>{

g.save();

g.beginPath();

g.rect(x,y,w,h);

g.clip();

g.fillStyle='#012169';

g.fillRect(x,y,w,h);

g.lineWidth=h*.2;

g.strokeStyle='#fff';

g.beginPath();

g.moveTo(x,y);
g.lineTo(x+w,y+h);

g.moveTo(x+w,y);
g.lineTo(x,y+h);

g.stroke();

g.lineWidth=h*.08;

g.strokeStyle='#c8102e';

g.stroke();

g.fillStyle='#fff';

g.fillRect(x,y+h*.36,w,h*.28);

g.fillRect(x+w*.4,y,w*.2,h);

g.fillStyle='#c8102e';

g.fillRect(x,y+h*.43,w,h*.14);

g.fillRect(x+w*.45,y,w*.1,h);

g.restore();

};

const T=ws.reduce((a,b)=>a+b);

let o=0;

f.k.forEach((k,i)=>{

const s=ws[i]/T;

g.fillStyle=k;

if(f.d=='h')
g.fillRect(x,y+o*h,w,s*h+1);

else
g.fillRect(x+o*w,y,s*w+1,h);

o+=s;

});

}

else{

g.fillStyle=f.k[0];

g.fillRect(x,y,w,h);

}

const X=f.x;

const dot=(cx,cy,r,col)=>{

g.fillStyle=col;

g.beginPath();

g.arc(
x+w*cx,
y+h*cy,
r,
0,
7
);

g.fill();

};

if(X=='br'){

g.fillStyle='#ffdf00';

g.moveTo(x+w*.5,y+h*.12);
g.lineTo(x+w*.9,y+h*.5);
g.lineTo(x+w*.5,y+h*.88);
g.lineTo(x+w*.1,y+h*.5);

let ac;

function beep(f,d,t){

try{

ac=ac||
new(window.AudioContext||window.webkitAudioContext)();

const o=ac.createOscillator();

const g=ac.createGain();

o.frequency.value=f;

o.type=t||'sine';

g.gain.value=.07;

o.connect(g);

g.connect(ac.destination);

o.start();

g.gain.exponentialRampToValueAtTime(
.001,
ac.currentTime+d
);

o.stop(ac.currentTime+d);

}catch(e){}

}


function say(t){

try{

const u=new SpeechSynthesisUtterance(t);

u.lang='en-US';

u.rate=.85;

speechSynthesis.cancel();

speechSynthesis.speak(u);

}catch(e){}

}

/* =========================

========================= */

function upd(dt){

G.t+=dt;

G.gt+=dt;


const sp=
(220+G.gi*8+G.mi*6)
*
(G.tb?1.8:1);


G.bg+=sp*dt;

G.jb-=dt;

G.inv-=dt;

G.eat-=dt;

G.so-=dt;


if(
G.jb>0
&&
G.y>=GY
){

G.vy=-730;

G.jb=0;

beep(520,.08);

}


G.vy+=1900*dt;

G.y=
Math.min(
GY,
G.y+G.vy*dt
);


if(G.y>=GY)
G.vy=0;


if(
G.so<=0
&&
!G.gate
&&
G.gt<3
){

const w=rnd(38,58);

const h=rnd(32,48);

G.ob.push({
x:W+20,
w,
h
});


if(Math.random()<.75)

G.fd.push({

x:W+20+w/2,

y:GY-rnd(95,125),

i:
Math.random()<.15
?FOOD.length-1
:Math.random()*(FOOD.length-1)|0

});


G.so=rnd(1.8,2.8);

}


if(
G.gt>5
&&
!G.gate
)

G.gate={
x:W+40
};


G.ob.forEach(o=>{

o.x-=sp*dt;


if(
G.inv<=0
&&
o.x<PX+8
&&
o.x+o.w>PX-8
&&
G.y>GY-o.h+14
)

hit();

});


G.fd.forEach(f=>{

f.x-=sp*dt;


if(
!f.g
&&
Math.abs(f.x-PX)<32
&&
f.y>=G.y-95
&&
f.y<=G.y+8
){

f.g=1;

const L=
FOOD[f.i][1]=='life';


G.score+=L?5:10;


if(L)
G.lives=
Math.min(
8,
G.lives+1
);


G.eat=.4;


G.pp.push({

x:f.x,

y:f.y,

t:1,

s:
L
?'+1 ❤️'
:FOOD[f.i][1]+'! +10'

});


beep(880,.1);

}

});


G.ob=
G.ob.filter(
o=>o.x>-80
);


G.fd=
G.fd.filter(
f=>f.x>-40&&!f.g
);


G.pp.forEach(p=>{

p.t-=dt;

p.y-=40*dt;

});


G.pp=
G.pp.filter(
p=>p.t>0
);


if(G.gate){

G.gate.x-=sp*dt;

if(
G.gate.x<PX+30
&&
G.st=='run'
)

openQ();

}

}

for(let i=0;i<4;i++){

const x=
((i*260-G.bg*.25)%1040+1040)%1040-120;

const y=
80+i%2*40;

c.beginPath();

c.arc(
x,
y,
26,
0,
7
);

c.arc(
x+30,
y-6,
32,
0,
7
);

c.arc(
x+60,
y+2,
24,
0,
7
);

c.fill();

}


c.fillStyle=T.h;


for(let i=0;i<4;i++){

const x=
((i*300-G.bg*.5)%1200+1200)%1200-150;

c.beginPath();

c.arc(
x,
GY+40,
150,
Math.PI,
0
);

c.fill();

}


c.fillStyle=T.g;

c.fillRect(
0,
GY,
W,
H-GY
);


c.fillStyle='#8a5a2b';

c.fillRect(
0,
GY+18,
W,
H-GY-18
);


c.fillStyle='#6f4520';

for(let i=0;i<12;i++)

c.fillRect(
((i*90-G.bg)%1080+1080)%1080-40,
GY+34,
30,
6
);


/* LEYENDA / LETRERO */

if(G.gate){

const g=G.gate;

const q=G.qs[G.gi];


c.fillStyle='#6b6f7a';

c.fillRect(
g.x,
GY-170,
7,
170
);


if(q){

if(q.fl){

flag(
c,
q.fl,
g.x+7,
GY-170,
96,
64
);

}

else{

c.fillStyle='#fff';

c.fillRect(
g.x+7,
GY-170,
80,
64
);

c.strokeStyle='#888';

c.strokeRect(
g.x+7,
GY-170,
80,
64
);

c.font='40px serif';

c.textAlign='center';

c.fillText(
q.ic||'🚩',
g.x+47,
GY-122
);

}

}


c.fillStyle='#ffd43b';

c.beginPath();

c.arc(
g.x+3,
GY-172,
7,
0,
7
);

c.fill();

}


G.ob.forEach(o=>{

c.fillStyle='#8d99ae';

c.beginPath();

c.moveTo(
o.x,
GY
);

c.quadraticCurveTo(
o.x+o.w*.1,
GY-o.h,
o.x+o.w/2,
GY-o.h
);

c.quadraticCurveTo(
o.x+o.w*.95,
GY-o.h,
o.x+o.w,
GY
);

c.fill();


c.fillStyle=
'rgba(255,255,255,.35)';

c.fillRect(
o.x+o.w*.3,
GY-o.h*.7,
o.w*.2,
5
);

});


c.font='34px serif';

c.textAlign='center';


G.fd.forEach(f=>

c.fillText(
FOOD[f.i][0],
f.x,
f.y+Math.sin(G.t*5+f.x)*4
)

);


if(
G.tb
&&
G.st=='run'
){

c.strokeStyle=
'rgba(255,255,255,.75)';

c.lineWidth=3;

for(let i=0;i<6;i++){

const y=
GY-30-i*38;

const x=
((i*97-G.bg*1.5)%260+260)%260;

c.beginPath();

c.moveTo(
x,
y
);

c.lineTo(
x+60,
y
);

c.stroke();

}

}


c.fillStyle=
'rgba(0,0,0,.28)';

c.beginPath();

c.ellipse(
PX,
GY+4,
Math.max(
8,
26-(GY-G.y)/8
),
6,
0,
0,
7
);

c.fill();


if(
G.inv<=0
||
Math.floor(G.inv*10)%2
)

kid(
PX,
G.y,
G.t,
G.y<GY,
G.eat
);


c.font='bold 20px sans-serif';

c.fillStyle='#1f2a44';

G.pp.forEach(p=>
c.fillText(
p.s,
p.x,
p.y
)
);


c.fillStyle=
'rgba(255,255,255,.88)';

c.fillRect(
10,
10,
W-20,
36
);


c.font='bold 22px sans-serif';

c.fillStyle='#1f2a44';


c.textAlign='left';

c.fillText(
'❤️'.repeat(
Math.max(0,G.lives)
),
20,
36
);


c.textAlign='center';

c.fillText(
'👤 '+(G.name||'Jugador')+
' · ⭐ '+G.score,
W/2,
36
);


c.textAlign='right';

c.fillText(
'🚩 '+G.gi+'/'+G.qs.length,
W-20,
36
);

}


/* =========================
   PREGUNTA
========================= */

function openQ(){

const q=G.qs[G.gi];


/* Protección contra pregunta inexistente */

if(!q){

G.gate=null;

G.st='run';

return;

}


G.st='q';


const n=G.qs.length;

const ans=q.o[0];

const last=
G.gi+1>=n;


const vis=
q.fl
?
'<canvas id="fc" width="180" height="120" style="max-width:60%"></canvas>'
:
`<div style="font-size:3.4rem">${q.ic}</div>`;


show(`

<small>
${M[G.mi].i}
${M[G.mi].n}
· 🚩 ${G.gi+1}/${n}
</small>

<br>

${vis}

<div class="q">

${q.q}

<button
class="btn"
id="sp"
aria-label="Listen"
>
🔊
</button>

</div>


<div
class="es"
id="es"
>
💡 ${q.es}
</div>


<button
class="btn"
id="hp"
>
💡 Ayuda en español
</button>


<div class="opts">

${
sh(q.o)
.map(x=>`

<button
class="btn op"
>
${x}
</button>

`)
.join('')
}

</div>


<div
id="fb"
aria-live="polite"
>
</div>

`);


if(q.fl)

flag(
$('#fc').getContext('2d'),
q.fl,
4,
4,
172,
112
);


$('#sp').onclick=()=>say(
q.q
.replace(/<[^>]+>/g,' ')
.replace(/___/g,'blank')
);


$('#hp').onclick=()=>
$('#es').classList.add('on');


const bs=[
...ov.querySelectorAll('.op')
];


bs.forEach(b=>

b.onclick=()=>{

const ok=
q.free
||
b.textContent==ans;


bs.forEach(x=>{

x.disabled=true;

if(
x.textContent==ans
&&
!q.free
)

x.classList.add('ok');

});


b.classList.add(
ok?'ok':'no'
);


if(ok){

G.score+=50;

G.ok++;

G.lives=
Math.min(
8,
G.lives+1
);

beep(784,.15);

}

else{

beep(
200,
.2,
'square'
);

}


const f=q.f
?
`<br>🌟 ${q.f[0]}<br><small>${q.f[1]}</small>`
:'';


$('#fb').innerHTML=`

<div
class="fb ${ok?'ok':'no'}"
>

<b>

${
ok
?
[
'Great job! 🎉',
'Excellent! 🌟',
'Super! 🚀'
][G.gi%3]
:
'Almost! Casi 💪 → '+ans
}

</b>

${f}

</div>


<button
class="btn pri"
id="nx"
style="margin-top:10px"
>

${last?'Finish 🏁':'Keep running ➡️'}

</button>

`;


$('#nx').onclick=()=>{

G.gi++;

G.gate=null;


/* Si era la última pregunta,
   termina la misión */

if(last)
return done();


G.gt=0;

G.so=1;

G.ob=[];

G.fd=[];

G.inv=1;

G.st='run';

hide();

};


$('#nx').focus();

}

);

}


/* =========================
   TERMINAR MISIÓN
========================= */

function done(){

G.st='win';

G.gate=null;


/* Guardar puntaje */

saveScore();


const m=M[G.mi];

const n=G.qs.length;

const mi=G.mi;

const r=G.ok/n;

const st=
r>=.9
?3
:r>=.6
?2
:1;


S.st[mi]=
Math.max(
S.st[mi]||0,
st
);


if(st>=2)
S.bd[mi]=m.b;


S.tot=G.score;


boom();


const all=
M.every(
(_,i)=>S.bd[i]
);


show(`

<p
style="font-size:3rem;margin:0"
>
${m.i}
</p>


<h1>
Mission complete!
</h1>


<p class="q">

${'⭐'.repeat(st)}
${'☆'.repeat(3-st)}

</p>


<p>

👤 <b>
${G.name||'Jugador'}
</b>

<br>

${G.ok}/${n}
correct

·

⭐ ${G.score}

</p>


${leaderboard()}


<p>

${
st>=2
?
'Badge: <b>'+m.b+'</b> 🎁'
:
'Play again to win the badge! Juega otra vez para ganar la insignia.'
}

</p>


${
all
?

`
<div class="fb ok">

<b>
🏆 You are a Culture Champion!
</b>

<br>

Aprendiste inglés y descubriste que cada cultura,
incluida la tuya, es valiosa.

¡Compártelo con tu familia!

<br>

<i>
Learning about other cultures helps us respect and celebrate them.
</i>

</div>
`

:

''
}


<div class="opts">

${
mi<M.length-1
?
'<button class="btn pri" id="nm">Next mission ➡️</button>'
:
''
}


<button
class="btn"
id="rp"
>
🔁 Play again
</button>


<button
class="btn"
id="mn"
>
🏠 Menu
</button>

</div>

`);


if($('#nm'))

$('#nm').onclick=
()=>intro(mi+1);


$('#rp').onclick=
()=>intro(mi);


$('#mn').onclick=
menu;

}


/* =========================
   BUCLE PRINCIPAL
========================= */

let last=0;


function loop(ts){

const dt=
Math.min(
.05,
(ts-last)/1000||0
);


last=ts;


if(G.st=='run')

upd(dt);

else if(G.st!='q'){

G.bg+=90*dt;

G.t+=dt;

}


draw();


requestAnimationFrame(loop);

}


/* =========================
   INICIAR
========================= */

menu();

requestAnimationFrame(loop);

</script>

</body>
</html>
